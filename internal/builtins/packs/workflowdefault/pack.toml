schema = 1

[[patch]]
id      = "workflow-optin"
summary = "Drop the Workflow tool's explicit-opt-in gate so a CLAUDE.md standing opt-in governs, without ultracode"
segment = "__BUN"

# The Workflow tool description opens with a hard gate: "ONLY call this tool when
# the user has explicitly opted into multi-agent orchestration", a closed
# five-bullet list of what counts as opt-in (none of which is a CLAUDE.md standing
# instruction), and "For any other task ... do NOT call this tool". Blank the whole
# gating block to spaces, keeping the surrounding paragraphs as anchors, so nothing
# in the tool description forbids the call and the project/user CLAUDE.md is what
# decides. The block's `${yt}` interpolation is blanked whole -- blanking only the
# identifier would leave `${}`, a template-literal syntax error.
[[patch.site]]
anchor  = "workflow opt-in gate"
find_b64 = ""
drop_b64 = ""

# The ultracode-off system-reminder (`ultra_effort_exit`) asserts that "the
# Workflow tool's standard opt-in rule applies again" -- a rule that no longer
# exists anywhere after the site above. It fires on every ultracode on->off
# transition, so a model receiving it could re-infer the gate from the assertion
# alone. Blank the claim, keeping "Ultracode is off —" so the reminder still
# reports the transition.
[[patch.site]]
anchor  = "ultracode-off reminder gate claim"
find_b64 = "VWx0cmFjb2RlIGlzIG9mZiBcdTIwMTQgdGhlIFdvcmtmbG93IHRvb2wncyBzdGFuZGFyZCBvcHQtaW4gcnVsZSBhcHBsaWVzIGFnYWluLg=="
drop_b64 = "IHRoZSBXb3JrZmxvdyB0b29sJ3Mgc3RhbmRhcmQgb3B0LWluIHJ1bGUgYXBwbGllcyBhZ2Fpbi4="

[[patch.derive]]
anchor  = "workflow opt-in gate"
pattern = '(?s)Use /workflows to watch live progress\.\n\n(?P<drop>ONLY call this tool [^`]*?to skip the ask\.)\n\nEvery script must begin with'
find    = 0
drop    = "drop"

[[patch.derive]]
anchor  = "ultracode-off reminder gate claim"
pattern = '''Ultracode is off \\u2014(?P<drop> the Workflow tool's standard opt-in rule applies again\.)'''
find    = 0
drop    = "drop"

[patch.heal]
prompt = """
Locate the Workflow tool's description string -- a long backtick template literal
that opens "Execute a workflow script that orchestrates multiple subagents". Two
sites:

1. The explicit-opt-in gate: the paragraph beginning "ONLY call this tool when the
   user has explicitly opted into multi-agent orchestration", through its bulleted
   list of what counts as opt-in, through the paragraph that starts "For any other
   task" and forbids calling the tool for anything else, ending at "to skip the
   ask." Output an edit that blanks that whole run to spaces, anchored on the
   unchanged sentences before and after it (the sentence ending "Use /workflows to
   watch live progress." and the paragraph starting "Every script must begin
   with"). Any `${...}` interpolation inside the run must be blanked whole --
   blanking only its identifier leaves `${}`, which is a syntax error.
2. The ultracode-off system-reminder, whose content asserts that the Workflow
   tool's standard opt-in rule "applies again". Blank that claim to spaces,
   keeping the "Ultracode is off" clause so the reminder still reports the
   transition.

Both edits are length-neutral: same byte count in, same byte count out.
"""
