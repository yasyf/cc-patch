schema = 1

[[patch]]
id      = "workflow-optin"
summary = "Drop the Workflow tool's explicit-opt-in gate so a CLAUDE.md standing opt-in governs, without ultracode"
segment = "__BUN"

# The Workflow tool description (template literal `A8a`) opens with a hard gate:
# "ONLY call this tool when the user has explicitly opted into multi-agent
# orchestration", a closed five-bullet list of what counts as opt-in (none of
# which is a CLAUDE.md standing instruction), and "For any other task ... do NOT
# call this tool". Blank the whole gating block to spaces, keeping the
# surrounding paragraphs as anchors, so nothing in the tool description forbids
# the call and the project/user CLAUDE.md is what decides. The block's `${li}`
# interpolation is blanked whole (5 bytes) -- blanking only the identifier would
# leave `${}`, a template-literal syntax error.
[[patch.site]]
anchor  = "workflow opt-in gate"
find_b64 = ""
drop_b64 = ""

# The Ultracode paragraph ends by pointing back at the gate ("revert to the
# opt-in rule above") whenever ultracode is off -- the session's normal state.
# Blank that pointer too, so no dangling reference reconstructs the gate.
[[patch.site]]
anchor  = "ultracode-off fallback pointer"
find_b64 = "bWVjaGFuaWNhbCBlZGl0cy4gV2hlbiBhIHJlbWluZGVyIHNheXMgdWx0cmFjb2RlIGlzIG9mZiwgcmV2ZXJ0IHRvIHRoZSBvcHQtaW4gcnVsZSBhYm92ZS4="
drop_b64 = "IFdoZW4gYSByZW1pbmRlciBzYXlzIHVsdHJhY29kZSBpcyBvZmYsIHJldmVydCB0byB0aGUgb3B0LWluIHJ1bGUgYWJvdmUu"

# The ultracode-off system-reminder (`ultra_effort_exit`) asserts that "the
# Workflow tool's standard opt-in rule applies again" -- a rule that no longer
# exists anywhere after site 0. It fires on every ultracode on->off transition,
# so a model receiving it could re-infer the gate from the assertion alone.
# Blank the claim, keeping "Ultracode is off —" so the reminder still
# reports the transition.
[[patch.site]]
anchor  = "ultracode-off reminder gate claim"
find_b64 = "VWx0cmFjb2RlIGlzIG9mZiBcdTIwMTQgdGhlIFdvcmtmbG93IHRvb2wncyBzdGFuZGFyZCBvcHQtaW4gcnVsZSBhcHBsaWVzIGFnYWluLg=="
drop_b64 = "IHRoZSBXb3JrZmxvdyB0b29sJ3Mgc3RhbmRhcmQgb3B0LWluIHJ1bGUgYXBwbGllcyBhZ2Fpbi4="

[[patch.derive]]
anchor  = "workflow opt-in gate"
pattern = '(?s)synthesizes\.\n\n(?P<drop>ONLY call this tool [^`]*?to skip the ask\.)\n\nWhen you do call it,'
find    = 0
drop    = "drop"

[[patch.derive]]
anchor  = "ultracode-off fallback pointer"
pattern = 'mechanical edits\.(?P<drop> When a reminder says ultracode is off, revert to the opt-in rule above\.)'
find    = 0
drop    = "drop"

[[patch.derive]]
anchor  = "ultracode-off reminder gate claim"
pattern = '''Ultracode is off \\u2014(?P<drop> the Workflow tool's standard opt-in rule applies again\.)'''
find    = 0
drop    = "drop"

[patch.heal]
prompt = """
Locate the Workflow tool's description string -- a long backtick template literal
that opens "Execute a workflow script that orchestrates multiple subagents". Two
sites:

1. The explicit-opt-in gate: the paragraph beginning "ONLY call this tool when the
   user has explicitly opted into multi-agent orchestration", through its bulleted
   list of what counts as opt-in, through the paragraph that starts "For any other
   task" and forbids calling the tool for anything else, ending at "to skip the
   ask." Output an edit that blanks that whole run to spaces, anchored on the
   unchanged sentences before and after it (the paragraph ending "what
   synthesizes." and the paragraph starting "When you do call it,"). Any `${...}`
   interpolation inside the run must be blanked whole -- blanking only its
   identifier leaves `${}`, which is a syntax error.
2. The Ultracode paragraph's trailing sentence telling the model to fall back to
   that gate when ultracode is off. Blank that sentence to spaces, keeping the
   preceding sentence's terminating period.
3. The ultracode-off system-reminder, whose content asserts that the Workflow
   tool's standard opt-in rule "applies again". Blank that claim to spaces,
   keeping the "Ultracode is off" clause so the reminder still reports the
   transition.

All three edits are length-neutral: same byte count in, same byte count out.
"""
