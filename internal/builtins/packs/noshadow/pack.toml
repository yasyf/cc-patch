schema = 1

[[patch]]
id      = "find-grep"
summary = "Fall back to system grep/find instead of the embedded ugrep/bfs shadow functions"
segment = "__BUN"

# Claude Code injects find()/grep() wrappers into every Bash shell that exec the
# embedded bfs/ugrep. The embedded ugrep busy-polls stdin in select() and can spin
# at 100% CPU indefinitely, outliving the tool call that spawned it. The wrapper
# already carries a fallback for a missing binary — `if [[ ! -x $_cc_bin ]]; then
# command <tool> …; return; fi` — so blanking the `! -x` test leaves `[[ $_cc_bin ]]`,
# always true for a resolved path, and every call takes the vendor's own fallback.
# The tool name is interpolated, so one edit covers both grep and find.
[patch.upstream]
issue = "anthropics/claude-code#69736"

# Two copies live in __BUN: a deduplicated JavaScriptCore constant-pool entry that
# the bundle's running bytecode reads, and the retained JS template source (`${e}`
# is the tool name). A raw length-neutral drop preserves the pool entry's 24-bit
# length while leaving the 24-bit RapidHash value that WTF precomputes from the old
# characters. The pool site rewrites the header and characters together, recomputing
# the hash.
# That entry ends immediately before the interpolation, so a minifier rename cannot
# change its characters. A pattern's TOML replace template cannot carry the entry's
# raw binary header, so its pinned derive below re-emits the pool site verbatim.
[[patch.site]]
anchor       = "shadow fallback (bytecode)"
pool_find    = '  if [[ ! -x $_cc_bin ]]; then command '
pool_replace = '  if [[      $_cc_bin ]]; then command '

[[patch.site]]
anchor = "shadow fallback (source)"
find   = '  if [[ ! -x $_cc_bin ]]; then command ${e}'
drop   = "! -x"

# Recovery replaces the whole site list, so the derive must cover both sites.
# The first block re-emits the pinned pool site; the second matches the source
# copy, where an update can rename the interpolated tool-name local while leaving
# the vendor-authored shell text intact.
[[patch.derive]]
anchor = "shadow fallback (bytecode)"
pinned = true

[[patch.derive]]
anchor  = "shadow fallback (source)"
pattern = '  if \[\[ (?P<drop>! -x) \$_cc_bin \]\]; then command \$\{\w+\}'
find    = 0
drop    = "drop"

[patch.heal]
prompt = """
Locate the retained JS template source for the shell function Claude Code writes
into its Bash shell snapshot to shadow `find` and `grep` with the embedded
`bfs`/`ugrep`. It resolves the CLI binary into a local (`_cc_bin`) and guards it
with a fallback of the form
`if [[ ! -x $_cc_bin ]]; then command <tool> ${1+"$@"}; return; fi`, where <tool> is
an interpolated variable holding the shadowed tool name. In the __BUN segment, the
tool name appears as a `${...}` interpolation immediately after the source fragment
to edit. Output one length-neutral edit that blanks the `! -x` test to spaces, so
the condition degrades to `[[ $_cc_bin ]]` — always true for a resolved path — and
every call takes the existing fallback to the system tool. Do not edit the separate
constant-pool copy: it is a pinned, hash-aware pool site that heal does not re-derive.
"""
