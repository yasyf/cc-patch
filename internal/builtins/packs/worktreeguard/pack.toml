schema = 1

[[patch]]
id      = "git-only-command-guard"
summary = "Run the worktree isolation command guard only on commands that mention git"
segment = "__BUN"

# A worktree-isolated agent session refuses shell commands a static check cannot
# prove stay inside its worktree. The guard opens by refusing everything the bash
# parser hands back as `{kind:"too-complex"}` — loops, `&&` chains, subshells, a
# heredoc that merely mentions a path — and its only call site gates on the shell
# being bash, never on the command touching git. So
# `for pr in 1 2 3; do gh pr view $pr; done` dies with "a worktree-isolated
# session's git operations must target its own worktree": a message about git, on
# a command with no git in it.
#
# Swap the `==="bash"` shell test for a `/git/` test on the raw command string the
# parser is about to consume, paying for the three extra bytes out of the `:null`
# alternative, which the following `if` reads as falsy either way. Every command
# naming git still takes the full check, and the cwd-escape guard immediately
# above this site is untouched. `/git/` over-matches by design (`digit`,
# `gitlab`): a false positive runs the guard, which is the safe direction.
#
# The guard function itself stays as it is. Its current call receives the parse,
# raw command string, shell cwd, and isolation root; its refusal reports that cwd
# and isolation root. It reads fields off the parse that a `{kind:"too-complex"}`
# result does not carry, so it must keep refusing every command it is actually
# called on; only the decision to call it moves.
[[patch.site]]
anchor  = "worktree command guard call site"
find    = 'let Uo=r==="bash"?KDt(Sn=await xle(e),e,En,Ln):null;'
replace = 'let Uo=/git/.test(e)?KDt(Sn=await xle(e),e,En,Ln):0;'

# Every identifier at this site is minified, so the derive carries the whole edit:
# the guard call and the command local are captured and replayed verbatim, and only
# the condition and the alternative are rewritten. It accepts the older
# `(parse,cwd,root)` call and the current `(parse,command,cwd,root)` call. A rename
# that changes the command local's width breaks length-neutrality, which the derive
# reports rather than emitting a resizing edit.
[[patch.derive]]
anchor   = "worktree command guard call site"
pattern  = '(?P<lead>let \w+=)\w+==="bash"\?(?P<guard>\w+\(\w+=await \w+\((?P<cmd>\w+)\)(?:,\w+){2,3}\)):null;'
find     = 0
replace  = '{{lead}}/git/.test({{cmd}})?{{guard}}:0;'

[patch.heal]
prompt = """
Claude Code refuses shell commands from a worktree-isolated agent session with a
message of the form "<agent> is isolated in the worktree <path>, but this command
<reason>. Refusing to run it — <its> git operations must target its own worktree."
The guard behind it is a function taking either the parsed command, shell cwd, and
isolation root or the parsed command, raw command string, shell cwd, and isolation
root. It returns that refusal string or null, and its first branch refuses anything
the bash parser did not return as `{kind:"simple"}` with the reason "is too complex
to verify that it stays inside the worktree".

Locate that guard's single call site in the shell-exec path. It reads either
`let <ref>=<shell>==="bash"?<guard>(<parsed>=await <parse>(<cmd>),<cwd>,<root>):null;`
or
`let <ref>=<shell>==="bash"?<guard>(<parsed>=await <parse>(<cmd>),<cmd>,<cwd>,<root>):null;`
and is immediately followed by
`if(<ref>)return <log>(` and the template literal
`[worktree] blocked shell exec: command guard refused (`. `<cmd>` is the raw
command string; `<parse>` is the async bash parser returning
`{kind:"simple"|"too-complex"}`.

Output one length-neutral edit replacing the `<shell>==="bash"` condition with
`/git/.test(<cmd>)` and shortening the `:null` alternative to `:0`, which the
following `if` treats identically. The three bytes the longer condition takes are
exactly the three the shorter alternative gives up; byte count in must equal byte
count out. Edit only this call site — the guard function's own body must keep
refusing every command it is called on.
"""


[[patch]]
id      = "drop-raw-substring-branch"
summary = "Stop refusing a compound command because its raw text merely contains the word git"
segment = "__BUN"

# The guard's non-simple branch tests `oxr`, which is `/git/i`, against the raw
# command string. Any compound command whose text contains those three letters
# anywhere is refused, whatever it does: `legitimate` in a comment, a `/git/`
# regex literal being used to read this very binary, a PR body. The branch sits
# in front of `yDt(e.tree)`, the structural walk that models chdirs and redirects
# off the parse tree, so removing it does not remove analysis — it hands the
# command to the analysis that was already there and is not textual.
#
# The `T$e(e)||e.tree===void 0` branch above it is untouched: a command whose
# parse aborted still refuses, because there is no tree to walk. Only the
# substring shortcut goes.
#
# Length neutrality comes from the three bytes `0&&` being paid for out of the
# tail of the message literal, which the short-circuit makes unreachable. The
# derive replays the captured identifiers, so a rename of `oxr`, `y` or `w` to
# any width stays neutral by construction.
[[patch.site]]
anchor  = "non-simple raw-substring branch"
find    = 'if(oxr.test(n))return y("names git in a form too complex to verify that it stays inside the worktree",w);'
replace = 'if(0&&oxr.test(n))return y("names git in a form too complex to verify that it stays inside the workt",w);'

[[patch.derive]]
anchor   = "non-simple raw-substring branch"
pattern  = 'if\((?P<re>\w+)\.test\((?P<cmd>\w+)\)\)return (?P<fn>\w+)\("names git in a form too complex to verify that it stays inside the worktree",(?P<alt>\w+)\);'
find     = 0
replace  = 'if(0&&{{re}}.test({{cmd}}))return {{fn}}("names git in a form too complex to verify that it stays inside the workt",{{alt}});'

[patch.heal]
prompt = """
Claude Code refuses shell commands from a worktree-isolated agent session. The
guard function takes the parsed command, the raw command string, the shell cwd
and the isolation root, and returns a refusal string or null.

Inside it, the branch handling a parse whose `kind` is not `"simple"` reads:

  if(<parsed>.kind!=="simple"){
    if(<aborted>(<parsed>)||<parsed>.tree===void 0)return <fail>("is too complex to verify that it stays inside the worktree",<split>);
    if(<re>.test(<cmd>))return <fail>("names git in a form too complex to verify that it stays inside the worktree",<split>);
    let <r>=<walk>(<parsed>.tree);return <r>===null?null:<fail>(<r>,<split>)
  }

`<re>` is a module-level regex equal to /git/i and `<cmd>` is the raw command
string, so that middle line refuses on a bare substring match.

Output one length-neutral edit that disables only that middle line, by
short-circuiting its condition with `0&&` and paying for those three bytes out
of the tail of its own message literal, which becomes unreachable. Do not touch
the branch above it or the tree walk below it. Byte count in must equal byte
count out.
"""


[[patch]]
id      = "drop-interpreter-payload-check"
summary = "Stop judging the text handed to a non-shell interpreter by whether it names git"
segment = "__BUN"

# POLICY REMOVAL, NOT A NARROWING. This deletes a check rather than tightening
# one, and it is a deliberate owner decision with the cost accepted up front.
#
# What it permits, stated plainly: an isolated session can now reach another
# worktree's git through an interpreter payload, for example
#
#   python3 -c "import subprocess; subprocess.run(['git','-C','/other/worktree','commit','-m','x'])"
#
# Nothing else in the guard sees that, because the payload is an opaque operand.
# The owner judged the false positives more expensive than this hole.
#
# What the check was: when a program that is not a shell is handed text, the
# analyzer cannot parse that text in the interpreter's own language, so it
# tokenizes it and refuses if any token IS the word git. That is not a sloppy
# substring test -- the predicate splits on non-word characters and matches
# whole tokens -- but prose, comments and identifiers contain the bare word
# constantly. A heredoc editing notes under ~/.claude was refused for the word
# appearing in a sentence; the identical heredoc with the word changed passed.
# Narrowing it soundly would mean parsing Python as Python, which a
# length-neutral byte edit cannot do, so the only available change is removal.
#
# Scope is exactly this branch. The structural path is untouched: a direct
# `git -C <other>` still refuses via the -C model, and `cd <other> ... git status`
# still refuses via the chdir model, both naming the resolved directory. The
# shell-payload path is untouched too -- text handed to sh/bash is still parsed
# and analysed, so `sh -c "git -C /other commit"` is unaffected by this patch.
#
# Length neutrality uses the same discipline as drop-raw-substring-branch: the
# three bytes of the short-circuit come out of the tail of this site's own
# message literal, which the short-circuit makes unreachable. The donor is dead
# code, never a live string. The derive captures the whole condition and the
# message up to the trim point, so every minified identifier is replayed at
# whatever width a future release gives it.
[[patch.site]]
anchor  = "non-shell interpreter payload check"
find    = '''if(n.simple&&!OT.has(xe)&&w$e([OT.has(We.split(/\s/)[0]??"")?We:"",...w.filter(tO).map((St)=>St.text)].join(`
`)))return`feeds ${xe} text naming git ${fm}, which cannot be shown to stay inside the worktree`;'''
replace = '''if(0&&n.simple&&!OT.has(xe)&&w$e([OT.has(We.split(/\s/)[0]??"")?We:"",...w.filter(tO).map((St)=>St.text)].join(`
`)))return`feeds ${xe} text naming git ${fm}, which cannot be shown to stay inside the workt`;'''

[[patch.derive]]
anchor   = "non-shell interpreter payload check"
pattern  = 'if\((?P<cond>n\.simple&&![\w$]+\.has\([\w$]+\)&&[\w$]+\(\[[\s\S]{0,220}?\.join\(`\n`\)\))\)return(?P<msg>`feeds \$\{[\w$]+} text naming git \$\{[\w$]+}, which cannot be shown to stay inside the workt)ree`;'
find     = 0
replace  = 'if(0&&{{cond}})return{{msg}}`;'

[patch.heal]
prompt = """
Claude Code refuses shell commands from a worktree-isolated agent session. Deep
in the command analyser there is a branch that fires when a plain command runs a
program that is NOT a shell and hands it text -- a heredoc, a -c argument, an
assembled payload. Because the analyser cannot parse that text in the
interpreter's own language, it tokenizes the text and refuses if any whole token
is the word git. Its message reads

  feeds <program> text naming git <where>, which cannot be shown to stay inside the worktree

and its condition tests that the parse is simple, that the program is not in the
shell set, and that a tokenizing predicate matches the joined payload text.

Output one length-neutral edit that disables only this branch, by
short-circuiting its condition with a falsy conjunct and paying for those bytes
out of the tail of its own message literal, which the short-circuit makes
unreachable. Do not touch the shell-payload analysis, the -C / --git-dir model,
the chdir model, or any branch that reads the parse tree. Byte count in must
equal byte count out.
"""


[[patch]]
id      = "expand-leading-tilde"
summary = "Expand a leading ~/ to the home directory instead of calling the path computed at runtime"
segment = "__BUN"

# Every directory the guard models -- a `cd` operand, an `env -C` value, a `-C`
# or `--git-dir` argument, an assignment's value -- goes through one resolver.
# It refuses a word it cannot pin to a directory before the command runs, and
# `~/x` is on that list: the opacity predicate it calls ends with
# `if(e.includes("~"))return!0`. So `cd ~/Code/other-repo && ... git log` dies
# with "changes directory to a location computed at runtime", and
# `git -C ~/.claude/worktrees/repo/lane branch --show-current` with "points git
# at a directory computed at runtime", while the same two commands with the home
# directory spelled out run. `~/x` is not computed at runtime: bash expands it to
# `$HOME/x` and nothing else.
#
# The resolver expands a leading `~/` itself, before the opacity predicate sees
# the word, and the rest of the guard is then handed the real path. The repo
# scoping the guard already does is what decides the verdict from there: the
# escape test resolves the session's roots and refuses only a directory that
# belongs to them without being inside this worktree, so an unrelated repository
# is allowed and the shared checkout is still refused -- now by its own name
# rather than as an unverifiable path.
#
# Only `~/` expands. `~user` is another user's home, which the resolver cannot
# know, and a bare `~` with no slash stays opaque too; both keep refusing. With
# HOME unset the word keeps its tilde and the opacity predicate refuses it,
# rather than resolving against the string "undefined".
#
# WHAT THIS PERMITS, stated plainly. Bash expands a tilde only unquoted, and the
# resolver is handed the decoded word with the quoting already gone, so this edit
# expands `'~/x'` and `"~/x"` too, where bash sends the literal three-character
# `~/x` instead. Those words used to refuse and now resolve, so the guard judges
# `$HOME/x` while the command reaches `<cwd>/~/x`. Reaching another checkout that
# way needs a directory or symlink literally named `~` inside the session's cwd
# pointing at one; absent that the real target stays inside the worktree, which
# the guard allows anyway. Fixing it properly means expanding where the parser
# still knows the word was unquoted, which this site cannot see and a
# length-neutral byte edit cannot reach. The owner took the narrower false
# refusals over that exposure.
#
# Length neutrality pays for the expansion out of the function's own shape: two
# `return null` guards fold into the disjunction they duplicate, the two
# `includes` calls become one regex, and the resolved path reuses the `n`
# parameter instead of a fresh local. Byte count in equals byte count out with
# nothing to spare. Every predicate call survives, on the same operand, with one
# reordering the fold forces: the absolute-path test now runs before the glob
# test rather than after it. Both are pure, so the returned value is unchanged.
[[patch.site]]
anchor  = "guard path resolver"
find    = 'function r5(e,n,r,s){if(Di(e)||e.includes("{}")||e.includes("\x00")||jDt(e)||WDt(e)||nl(e)||s&&lk(e)!==-1)return null;if(r&&!WTr(e))return null;let g=Ze(e,n);if(jDt(g)||WDt(g))return null;return g}'
replace = 'function r5(e,n,r,s){return /^~\//.test(e)&&(e=(process.env.HOME??"~")+e.slice(1)),Di(e)||/\{\}|\0/.test(e)||jDt(e)||WDt(e)||nl(e)||r&&!WTr(e)||s&&lk(e)!==-1?null:(n=Ze(e,n),jDt(n)||WDt(n)?null:n)}'

# Every identifier here is minified, so the derive captures each one and replays
# it. RE2 has no backreferences, so each repeated operand reads as a bare `\w+`
# rather than a backreference to the parameter; the shape around it -- five
# predicates in one disjunction, the absolute-path guard, the resolve, the
# post-resolve pair -- is specific enough that no other function in the bundle
# matches it, and it matches exactly once in 2.1.278.
#
# That pattern pins the shape, not which operand each predicate reads. A future
# bundle that kept this exact shape while changing an operand -- testing the glob
# flag where the absolute-path flag is tested, returning the unresolved word --
# would still match, and the template would render this patch's semantics over
# it. RE2 cannot express the equality that would catch it. What does catch it is
# the pinned site: a semantic change ships new bytes, `find` stops matching, and
# `heal` escalates with the prompt below instead of the derive deciding alone.
#
# Neutrality depends on the widths this site's identifiers have: the rewrite
# spells the first parameter twelve times where the original spells it ten and
# the second six times where the original spells it twice, while the original's
# local disappears. A rename that changes any of those widths breaks length
# neutrality, which the derive reports rather than emitting a resizing edit.
[[patch.derive]]
anchor   = "guard path resolver"
pattern  = 'function (?P<fn>\w+)\((?P<e>\w+),(?P<n>\w+),(?P<r>\w+),(?P<s>\w+)\)\{if\((?P<di>\w+)\(\w+\)\|\|\w+\.includes\("\{\}"\)\|\|\w+\.includes\("\\x00"\)\|\|(?P<jdt>\w+)\(\w+\)\|\|(?P<wdt>\w+)\(\w+\)\|\|(?P<nl>\w+)\(\w+\)\|\|\w+&&(?P<lk>\w+)\(\w+\)!==-1\)return null;if\(\w+&&!(?P<abs>\w+)\(\w+\)\)return null;let \w+=(?P<res>\w+)\(\w+,\w+\);if\(\w+\(\w+\)\|\|\w+\(\w+\)\)return null;return \w+\}'
find     = 0
replace  = 'function {{fn}}({{e}},{{n}},{{r}},{{s}}){return /^~\//.test({{e}})&&({{e}}=(process.env.HOME??"~")+{{e}}.slice(1)),{{di}}({{e}})||/\{\}|\0/.test({{e}})||{{jdt}}({{e}})||{{wdt}}({{e}})||{{nl}}({{e}})||{{r}}&&!{{abs}}({{e}})||{{s}}&&{{lk}}({{e}})!==-1?null:({{n}}={{res}}({{e}},{{n}}),{{jdt}}({{n}})||{{wdt}}({{n}})?null:{{n}})}'

[patch.heal]
prompt = """
Claude Code refuses shell commands from a worktree-isolated agent session. Every
directory the guard models runs through one resolver, which returns the resolved
directory or null when the word cannot be pinned before the command runs. It
reads

  function <fn>(<word>,<cwd>,<mustBeAbsolute>,<hasGlob>){
    if(<computed>(<word>)||<word>.includes("{}")||<word>.includes("\\x00")||<device>(<word>)||<opaque>(<word>)||<other>(<word>)||<hasGlob>&&<glob>(<word>)!==-1)return null;
    if(<mustBeAbsolute>&&!<isAbsolute>(<word>))return null;
    let <resolved>=<resolve>(<word>,<cwd>);
    if(<device>(<resolved>)||<opaque>(<resolved>))return null;
    return <resolved>
  }

`<opaque>` is the predicate whose last test is `if(<word>.includes("~"))return!0`,
which is why `~/x` resolves to null and the guard reports a location computed at
runtime.

Output one length-neutral edit to that resolver so a word matching /^~\\// has its
tilde replaced by process.env.HOME before any predicate sees it, falling back to
leaving the tilde in place when HOME is unset. Keep every predicate call, in the
same order, on the same word, and keep the post-resolve pair. Fund the added bytes
inside this function: fold the second `return null` guard into the first
disjunction, fold the two `includes` calls into one regex, and reuse a parameter
for the resolved path instead of declaring a local. Do not expand `~user` or a
bare `~`. Byte count in must equal byte count out. Edit no other function.
"""
