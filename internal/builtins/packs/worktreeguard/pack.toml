schema = 1

[[patch]]
id      = "git-only-command-guard"
summary = "Run the worktree isolation command guard only on commands that mention git"
segment = "__BUN"

# A worktree-isolated agent session refuses shell commands a static check cannot
# prove stay inside its worktree. The guard opens by refusing everything the bash
# parser hands back as `{kind:"too-complex"}` — loops, `&&` chains, subshells, a
# heredoc that merely mentions a path — and its only call site gates on the shell
# being bash, never on the command touching git. So
# `for pr in 1 2 3; do gh pr view $pr; done` dies with "a worktree-isolated
# session's git operations must target its own worktree": a message about git, on
# a command with no git in it.
#
# Swap the `==="bash"` shell test for a `/git/` test on the raw command string the
# parser is about to consume, paying for the three extra bytes out of the `:null`
# alternative, which the following `if` reads as falsy either way. Every command
# naming git still takes the full check, and the cwd-escape guard immediately
# above this site is untouched. `/git/` over-matches by design (`digit`,
# `gitlab`): a false positive runs the guard, which is the safe direction.
#
# The guard function itself stays as it is. Its current call receives the parse,
# raw command string, shell cwd, and isolation root; its refusal reports that cwd
# and isolation root. It reads fields off the parse that a `{kind:"too-complex"}`
# result does not carry, so it must keep refusing every command it is actually
# called on; only the decision to call it moves.
[[patch.site]]
anchor  = "worktree command guard call site"
find    = 'let Uo=r==="bash"?KDt(Sn=await xle(e),e,En,Ln):null;'
replace = 'let Uo=/git/.test(e)?KDt(Sn=await xle(e),e,En,Ln):0;'

# Every identifier at this site is minified, so the derive carries the whole edit:
# the guard call and the command local are captured and replayed verbatim, and only
# the condition and the alternative are rewritten. It accepts the older
# `(parse,cwd,root)` call and the current `(parse,command,cwd,root)` call. A rename
# that changes the command local's width breaks length-neutrality, which the derive
# reports rather than emitting a resizing edit.
[[patch.derive]]
anchor   = "worktree command guard call site"
pattern  = '(?P<lead>let \w+=)\w+==="bash"\?(?P<guard>\w+\(\w+=await \w+\((?P<cmd>\w+)\)(?:,\w+){2,3}\)):null;'
find     = 0
replace  = '{{lead}}/git/.test({{cmd}})?{{guard}}:0;'

[patch.heal]
prompt = """
Claude Code refuses shell commands from a worktree-isolated agent session with a
message of the form "<agent> is isolated in the worktree <path>, but this command
<reason>. Refusing to run it — <its> git operations must target its own worktree."
The guard behind it is a function taking either the parsed command, shell cwd, and
isolation root or the parsed command, raw command string, shell cwd, and isolation
root. It returns that refusal string or null, and its first branch refuses anything
the bash parser did not return as `{kind:"simple"}` with the reason "is too complex
to verify that it stays inside the worktree".

Locate that guard's single call site in the shell-exec path. It reads either
`let <ref>=<shell>==="bash"?<guard>(<parsed>=await <parse>(<cmd>),<cwd>,<root>):null;`
or
`let <ref>=<shell>==="bash"?<guard>(<parsed>=await <parse>(<cmd>),<cmd>,<cwd>,<root>):null;`
and is immediately followed by
`if(<ref>)return <log>(` and the template literal
`[worktree] blocked shell exec: command guard refused (`. `<cmd>` is the raw
command string; `<parse>` is the async bash parser returning
`{kind:"simple"|"too-complex"}`.

Output one length-neutral edit replacing the `<shell>==="bash"` condition with
`/git/.test(<cmd>)` and shortening the `:null` alternative to `:0`, which the
following `if` treats identically. The three bytes the longer condition takes are
exactly the three the shorter alternative gives up; byte count in must equal byte
count out. Edit only this call site — the guard function's own body must keep
refusing every command it is called on.
"""


[[patch]]
id      = "drop-raw-substring-branch"
summary = "Stop refusing a compound command because its raw text merely contains the word git"
segment = "__BUN"

# The guard's non-simple branch tests `oxr`, which is `/git/i`, against the raw
# command string. Any compound command whose text contains those three letters
# anywhere is refused, whatever it does: `legitimate` in a comment, a `/git/`
# regex literal being used to read this very binary, a PR body. The branch sits
# in front of `yDt(e.tree)`, the structural walk that models chdirs and redirects
# off the parse tree, so removing it does not remove analysis — it hands the
# command to the analysis that was already there and is not textual.
#
# The `T$e(e)||e.tree===void 0` branch above it is untouched: a command whose
# parse aborted still refuses, because there is no tree to walk. Only the
# substring shortcut goes.
#
# Length neutrality comes from the three bytes `0&&` being paid for out of the
# tail of the message literal, which the short-circuit makes unreachable. The
# derive replays the captured identifiers, so a rename of `oxr`, `y` or `w` to
# any width stays neutral by construction.
[[patch.site]]
anchor  = "non-simple raw-substring branch"
find    = 'if(oxr.test(n))return y("names git in a form too complex to verify that it stays inside the worktree",w);'
replace = 'if(0&&oxr.test(n))return y("names git in a form too complex to verify that it stays inside the workt",w);'

[[patch.derive]]
anchor   = "non-simple raw-substring branch"
pattern  = 'if\((?P<re>\w+)\.test\((?P<cmd>\w+)\)\)return (?P<fn>\w+)\("names git in a form too complex to verify that it stays inside the worktree",(?P<alt>\w+)\);'
find     = 0
replace  = 'if(0&&{{re}}.test({{cmd}}))return {{fn}}("names git in a form too complex to verify that it stays inside the workt",{{alt}});'

[patch.heal]
prompt = """
Claude Code refuses shell commands from a worktree-isolated agent session. The
guard function takes the parsed command, the raw command string, the shell cwd
and the isolation root, and returns a refusal string or null.

Inside it, the branch handling a parse whose `kind` is not `"simple"` reads:

  if(<parsed>.kind!=="simple"){
    if(<aborted>(<parsed>)||<parsed>.tree===void 0)return <fail>("is too complex to verify that it stays inside the worktree",<split>);
    if(<re>.test(<cmd>))return <fail>("names git in a form too complex to verify that it stays inside the worktree",<split>);
    let <r>=<walk>(<parsed>.tree);return <r>===null?null:<fail>(<r>,<split>)
  }

`<re>` is a module-level regex equal to /git/i and `<cmd>` is the raw command
string, so that middle line refuses on a bare substring match.

Output one length-neutral edit that disables only that middle line, by
short-circuiting its condition with `0&&` and paying for those three bytes out
of the tail of its own message literal, which becomes unreachable. Do not touch
the branch above it or the tree walk below it. Byte count in must equal byte
count out.
"""
